
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUMA BAKERY — Admin</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f6f1e9;
    color:#38271f;
    font-family:Arial,sans-serif;
}

header{
    background:#38271f;
    color:white;
    padding:22px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    margin:0;
    font-size:22px;
    letter-spacing:2px;
}

main{
    max-width:1100px;
    margin:35px auto;
    padding:0 18px;
}

.panel{
    background:white;
    border-radius:16px;
    padding:24px;
    margin-bottom:22px;
    box-shadow:0 5px 25px #38271f10;
}

h2{margin-top:0}

input,button{font:inherit}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd1c5;
    border-radius:9px;
    margin:6px 0 14px;
}

button{
    border:0;
    border-radius:9px;
    padding:11px 16px;
    background:#76503c;
    color:white;
    cursor:pointer;
}

button:hover{opacity:.85}

button.secondary{
    background:#e9dfd5;
    color:#38271f;
}

button.danger{background:#a33b32}
button.success{background:#39734c}

.grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
}

.product{
    border:1px solid #eee2d8;
    padding:16px;
    border-radius:12px;
}

.product.inactive{
    opacity:.72;
    background:#faf7f3;
}

.product img{
    width:100%;
    height:170px;
    object-fit:cover;
    border-radius:9px;
    background:#eee;
}

.product h3{margin:12px 0 5px}

.muted{
    color:#88786e;
    font-size:13px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}

.order{
    border:1px solid #eee2d8;
    padding:16px;
    border-radius:12px;
    margin:12px 0;
}

.hidden{display:none!important}

.topline{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    margin-top:5px;
}

.status.active{
    background:#e2f3e6;
    color:#28683b;
}

.status.inactive{
    background:#f5e5e2;
    color:#a33b32;
}

.message{
    margin-top:12px;
    color:#76503c;
}

@media(max-width:650px){
    .grid{grid-template-columns:1fr}
    header{padding:18px}
    main{margin:20px auto}
    .panel{padding:17px}
}
</style>
</head>

<body>

<header>
    <h1>SUMA BAKERY</h1>
    <span>ADMIN PANEL</span>
</header>

<main>

<section id="loginPanel" class="panel">
    <h2>Вход администратора</h2>
    <p class="muted">Введи логин и пароль администратора.</p>

    <form id="loginForm">
        <label>Логин</label>
        <input id="username" autocomplete="username" required>

        <label>Пароль</label>
        <input id="password" type="password"
               autocomplete="current-password" required>

        <button type="submit">Войти</button>
    </form>

    <div id="loginMessage"></div>
</section>

<section id="dashboard" class="hidden">

    <div class="panel topline">
        <div>
            <h2>Панель управления</h2>
            <p class="muted">Управление каталогом и заказами SUMA BAKERY</p>
        </div>

        <button class="secondary" onclick="logout()">Выйти</button>
    </div>

    <section class="panel">
        <h2>Добавить десерт</h2>

        <form id="productForm">

            <div class="grid">
                <div>
                    <label>Название на русском</label>
                    <input id="name_ru" required maxlength="120">
                </div>

                <div>
                    <label>Название на узбекском</label>
                    <input id="name_uz" required maxlength="120">
                </div>

                <div>
                    <label>Цена (сум)</label>
                    <input id="price" type="number" min="1" required>
                </div>

                <div>
                    <label>Категория</label>
                    <input id="category" value="dessert">
                </div>
            </div>

            <label>Ссылка на фотографию</label>
            <input id="image_url" type="url" placeholder="https://...">

            <div class="grid">
                <div>
                    <label>Описание на русском</label>
                    <input id="description_ru">
                </div>

                <div>
                    <label>Описание на узбекском</label>
                    <input id="description_uz">
                </div>
            </div>

            <button type="submit">Добавить десерт</button>
            <div id="productMessage" class="message"></div>

        </form>
    </section>

    <section class="panel">

        <div class="topline">
            <h2>Каталог товаров</h2>
            <button class="secondary" onclick="loadProducts()">Обновить</button>
        </div>

        <p class="muted">
            Здесь отображаются активные и скрытые товары.
        </p>

        <div id="products" class="grid"></div>

    </section>

    <section class="panel">

        <div class="topline">
            <h2>Последние заказы</h2>
            <button class="secondary" onclick="loadOrders()">Обновить</button>
        </div>

        <div id="orders"></div>

    </section>

</section>

</main>

<script>
const $ = id => document.getElementById(id);

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    })[char]);
}

async function api(url, options = {}) {

    const response = await fetch(url, {
        credentials:"same-origin",
        ...options,
        headers:{
            ...(options.headers || {}),
            ...(options.body ? {"Content-Type":"application/json"} : {})
        }
    });

    const text = await response.text();

    let data = {};

    try {
        data = text ? JSON.parse(text) : {};
    } catch {}

    if (!response.ok) {
        throw new Error(data.detail || `Ошибка сервера: ${response.status}`);
    }

    return data;
}

function showDashboard() {
    $("loginPanel").classList.add("hidden");
    $("dashboard").classList.remove("hidden");

    loadProducts();
    loadOrders();
}

async function checkLogin() {
    try {
        await api("/api/admin/me");
        showDashboard();
    } catch {
        $("loginPanel").classList.remove("hidden");
        $("dashboard").classList.add("hidden");
    }
}

$("loginForm").addEventListener("submit", async event => {

    event.preventDefault();

    $("loginMessage").textContent = "Проверка входа...";

    try {
        await api("/api/admin/login", {
            method:"POST",
            body:JSON.stringify({
                username:$("username").value,
                password:$("password").value
            })
        });

        $("password").value = "";
        $("loginMessage").textContent = "";

        showDashboard();

    } catch(error) {
        $("loginMessage").textContent = error.message;
    }
});

async function logout() {

    try {
        await api("/api/admin/logout", {method:"POST"});
    } finally {
        $("dashboard").classList.add("hidden");
        $("loginPanel").classList.remove("hidden");
    }
}

// ДОБАВЛЕНИЕ ТОВАРА

$("productForm").addEventListener("submit", async event => {

    event.preventDefault();

    $("productMessage").textContent = "Сохранение...";

    const product = {
        name_ru:$("name_ru").value.trim(),
        name_uz:$("name_uz").value.trim(),
        price:Number($("price").value),
        category:$("category").value.trim() || "dessert",
        image_url:$("image_url").value.trim(),
        description_ru:$("description_ru").value.trim(),
        description_uz:$("description_uz").value.trim(),
        active:true
    };

    try {
        await api("/api/admin/products", {
            method:"POST",
            body:JSON.stringify(product)
        });

        $("productForm").reset();
        $("category").value = "dessert";

        $("productMessage").textContent = "Товар успешно добавлен!";

        await loadProducts();

    } catch(error) {
        $("productMessage").textContent = error.message;
    }
});

// ЗАГРУЗКА ВСЕХ ТОВАРОВ

async function loadProducts() {

    $("products").innerHTML = "Загрузка товаров...";

    try {

        const data = await api("/api/admin/products");
        const products = data.products || [];

        if (!products.length) {
            $("products").textContent = "Товаров пока нет.";
            return;
        }

        $("products").innerHTML = products.map(p => {

            const active = p.active === true;

            const image = p.image_url &&
                /^https?:\/\//i.test(p.image_url)
                ? `<img src="${escapeHTML(p.image_url)}" alt="">`
                : "";

            return `
                <article class="product ${active ? "" : "inactive"}">

                    ${image}

                    <h3>${escapeHTML(p.name_ru)}</h3>

                    <div>${escapeHTML(p.name_uz)}</div>

                    <p>
                        <b>${Number(p.price).toLocaleString("ru-RU")} сум</b>
                    </p>

                    <p class="muted">ID: ${p.id}</p>

                    <span class="status ${active ? "active" : "inactive"}">
                        ${active ? "Товар опубликован" : "Товар скрыт"}
                    </span>

                    <div class="actions">

                        <button onclick="editProduct(${p.id})">
                            Изменить
                        </button>

                        ${
                            active
                            ? `<button class="danger"
                                onclick="changeVisibility(${p.id}, false)">
                                Скрыть
                               </button>`
                            : `<button class="success"
                                onclick="changeVisibility(${p.id}, true)">
                                Показать
                               </button>`
                        }

                    </div>

                </article>
            `;

        }).join("");

    } catch(error) {
        $("products").textContent = error.message;
    }
}

// ПОКАЗАТЬ / СКРЫТЬ ТОВАР

async function changeVisibility(id, active) {

    const action = active ? "показать" : "скрыть";

    if (!confirm(`Ты действительно хочешь ${action} этот товар?`)) {
        return;
    }

    try {

        await api(`/api/admin/products/${id}`, {
            method:"PATCH",
            body:JSON.stringify({
                active:active
            })
        });

        await loadProducts();

        alert(active
            ? "Товар снова опубликован!"
            : "Товар скрыт из каталога!"
        );

    } catch(error) {
        alert("Ошибка: " + error.message);
    }
}

// РЕДАКТИРОВАНИЕ

async function editProduct(id) {

    try {

        const data = await api("/api/admin/products");

        const p = (data.products || []).find(item => item.id === id);

        if (!p) {
            return alert("Товар не найден.");
        }

        const ru = prompt("Название на русском:", p.name_ru);
        if (ru === null) return;

        const uz = prompt("Название на узбекском:", p.name_uz);
        if (uz === null) return;

        const priceText = prompt("Цена в сумах:", p.price);
        if (priceText === null) return;

        const price = Number(priceText);

        if (!Number.isInteger(price) || price <= 0) {
            return alert("Укажи правильную цену.");
        }

        const image = prompt("Ссылка на фотографию:", p.image_url || "");
        if (image === null) return;

        await api(`/api/admin/products/${id}`, {
            method:"PATCH",
            body:JSON.stringify({
                name_ru:ru.trim(),
                name_uz:uz.trim(),
                price,
                image_url:image.trim()
            })
        });

        alert("Товар обновлён!");

        await loadProducts();

    } catch(error) {
        alert(error.message);
    }
}

// ЗАКАЗЫ

async function loadOrders() {

    $("orders").innerHTML = "Загрузка заказов...";

    try {

        const data = await api("/api/admin/orders");
        const orders = data.orders || [];

        if (!orders.length) {
            $("orders").textContent = "Заказов пока нет.";
            return;
        }

        $("orders").innerHTML = orders.map(order => {

            const items = Array.isArray(order.items)
                ? order.items
                : [];

            const itemsHTML = items.map(item => `
                <li>
                    ${escapeHTML(item.name)}
                    × ${Number(item.quantity)}
                </li>
            `).join("");

            return `
                <article class="order">

                    <h3>Заказ №${order.id}</h3>

                    <p><b>Клиент:</b>
                    ${escapeHTML(order.customer_name)}</p>

                    <p><b>Телефон:</b>
                    ${escapeHTML(order.phone)}</p>

                    <p><b>Товары:</b></p>

                    <ul>${itemsHTML}</ul>

                    <p><b>Итого:</b>
                    ${Number(order.total_price).toLocaleString("ru-RU")} сум</p>

                    <p><b>Комментарий:</b>
                    ${escapeHTML(order.comment || "Нет")}</p>

                    <p class="muted">
                        Статус: ${escapeHTML(order.status)}
                        · ${escapeHTML(order.created_at)}
                    </p>

                </article>
            `;

        }).join("");

    } catch(error) {
        $("orders").textContent = error.message;
    }
}

checkLogin();
</script>

</body>
</html>
